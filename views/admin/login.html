<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin access — Inveni</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="login-page">

    <main class="login-card">

        <a class="brand" href="../index.html">
            <span class="brand-mark">i</span>
            <span>inveni<span class="brand-dot">.</span></span>
        </a>

        <span class="eyebrow">WORKSPACE ACCESS</span>

        <h1>Admin sign-in</h1>

        <p>Sign in to access your Inveni administration workspace.</p>

        <form id="loginForm" class="login-form">

            <div class="form-group">
                <label for="email">Email address</label>

                <div class="input-wrapper">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your admin email"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Show password"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <p id="loginError" class="login-error" role="alert"></p>

            <button
                type="submit"
                id="loginButton"
                class="button button-dark"
            >
                Sign in
            </button>

        </form>

        <a class="back-link" href="../index.html">
            ← Return to Inveni
        </a>

    </main>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';

            passwordInput.type = isPassword ? 'text' : 'password';

            togglePassword.setAttribute(
                'aria-label',
                isPassword ? 'Hide password' : 'Show password'
            );
        });
    </script>

    <script src="../js/admin-login.js"></script>

</body>
</html>
